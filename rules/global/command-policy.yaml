forbidden_commands:
  - match: "git push --force"
    reason: "force Git push is blocked by policy"
  - match: "git push --force-with-lease"
    reason: "force Git push is blocked by policy"
  - match: "git push -f"
    reason: "force Git push is blocked by policy"
  - match: "git push --mirror"
    reason: "mirror Git push is blocked by policy"
  - match: "git reset --hard"
    reason: "git reset --hard is blocked by policy"
  - match: "rm -rf"
    reason: "rm -rf is blocked by policy"
  - match: "curl | sh"
    reason: "curl piped to a shell is blocked by policy"
  - match: "npm install"
    reason: "npm install is blocked by policy"
  - match: "pnpm add"
    reason: "pnpm add is blocked by policy"
  - match: "pip install"
    reason: "pip install is blocked by policy"
  - match: "chmod -R 777"
    reason: "chmod -R 777 is blocked by policy"
