[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-careflow"
version = "0.1.0"
description = "Control repository tooling for AI coding-agent case workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-careflow maintainers" }]
dependencies = []

[project.scripts]
agent-careflow = "agent_careflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
